plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.monospace.notes'
version = '1.0.0'

def repositoryRoot = rootProject.projectDir.parentFile
def engineOutput = layout.buildDirectory.dir('engine').get().asFile
def engineAbis = findProperty('reactNativeArchitectures') ?: 'arm64-v8a'

tasks.register('buildEngine', Exec) {
  inputs.files(fileTree(dir: "$repositoryRoot/crates", exclude: '**/target/**'))
  inputs.files("$repositoryRoot/Cargo.toml", "$repositoryRoot/Cargo.lock", "$repositoryRoot/rust-toolchain.toml", "$repositoryRoot/.cargo/config.toml", "$repositoryRoot/scripts/build-engine.sh")
  inputs.property('abis', engineAbis)
  outputs.dir(engineOutput)
  environment 'ANDROID_NDK_HOME', android.ndkDirectory.absolutePath
  commandLine "$repositoryRoot/scripts/build-engine.sh", engineOutput.path, engineAbis
}

android {
  sourceSets {
    main {
      java.srcDir(new File(engineOutput, 'kotlin'))
      jniLibs.srcDir(new File(engineOutput, 'jniLibs'))
    }
  }

  namespace "com.monospace.notes.repository"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    consumerProguardFiles 'consumer-rules.pro'
  }
}

dependencies {
  implementation 'net.java.dev.jna:jna:5.17.0@aar'
}

tasks.named('preBuild') { dependsOn 'buildEngine' }
