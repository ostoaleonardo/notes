appId: com.monospace.notes
---
- launchApp
- extendedWaitUntil:
    visible:
      id: app-bar-menu
    timeout: 30000
- tapOn:
    id: home-create-note
- waitForAnimationToEnd
- tapOn:
    id: editor-title
- eraseText: 20
- inputText: maestro-temp
- hideKeyboard
- waitForAnimationToEnd
- runFlow: subflows/open-drawer.yml
- assertVisible: maestro-temp
- back
- waitForAnimationToEnd
- tapOn:
    id: editor-menu
- waitForAnimationToEnd
- tapOn:
    id: menu-item-delete
- tapOn:
    id: dialog-confirm
- waitForAnimationToEnd
- assertVisible:
    id: home-create-note
- runFlow: subflows/open-drawer.yml
- assertNotVisible: maestro-temp
