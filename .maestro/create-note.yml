appId: com.monospace.notes
---
- launchApp
- extendedWaitUntil:
    visible:
      id: app-bar-menu
    timeout: 30000
- tapOn:
      id: home-create-note
- waitForAnimationToEnd
- assertNotVisible:
      id: home-create-note
- back
- waitForAnimationToEnd
- assertVisible:
      id: home-create-note
