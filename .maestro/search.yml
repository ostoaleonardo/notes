appId: com.monospace.notes
---
- runFlow: subflows/create-fixture-note.yml
- tapOn:
    id: editor-mode-toggle
- waitForAnimationToEnd
- tapOn:
    id: toolbar-search
- waitForAnimationToEnd
- assertVisible:
    id: search-suggestions
- tapOn:
    id: search-input
- inputText: maestro-fix
- tapOn:
    point: 50%,70%
- waitForAnimationToEnd
- assertNotVisible:
    id: search-suggestions
- tapOn:
    id: search-filter-button
- assertVisible:
    id: search-filter-panel
- tapOn:
    id: search-filter-pinned
- tapOn:
    id: search-filter-button
- tapOn:
    id: search-chips-summary
- assertVisible:
    id: search-chip-is:pinned
- back
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: search-input
    commands:
      - back
- waitForAnimationToEnd
- runFlow: subflows/delete-note.yml
