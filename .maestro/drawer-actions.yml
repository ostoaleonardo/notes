appId: com.monospace.notes
---
- launchApp
- extendedWaitUntil:
    visible:
      id: app-bar-menu
    timeout: 30000
- runFlow: subflows/open-drawer.yml
- longPressOn: "(?i)folder 3"
- waitForAnimationToEnd
- tapOn:
      id: menu-item-.*
      index: 1
- waitForAnimationToEnd
- assertVisible:
      id: dialog-cancel
- tapOn:
      id: dialog-cancel
- waitForAnimationToEnd
- hideKeyboard
- waitForAnimationToEnd
- runFlow:
      when:
          notVisible: "(?i)folder 1"
      commands:
          - tapOn:
                id: app-bar-menu
          - waitForAnimationToEnd
- tapOn: "(?i)folder 1"
- waitForAnimationToEnd
- assertVisible: "(?i)subfolder 1.1"
- assertVisible:
      id: drawer-edit-folder
- assertVisible:
      id: drawer-delete-folder
- back
- waitForAnimationToEnd
- assertVisible: "(?i)folder 2"
- assertNotVisible: "(?i)subfolder 1.1"
- assertNotVisible:
      id: drawer-edit-folder
- tapOn:
      id: drawer-sort
- waitForAnimationToEnd
- assertVisible:
      id: menu-item-.*
- tapOn:
      id: menu-item-.*
      index: 1
- waitForAnimationToEnd
- assertNotVisible:
      id: menu-item-.*
- assertVisible:
      id: drawer-sort
- tapOn:
      id: drawer-add-subfolder
- waitForAnimationToEnd
- assertVisible:
      id: dialog-cancel
- tapOn:
      id: dialog-cancel
- waitForAnimationToEnd
- hideKeyboard
- waitForAnimationToEnd
- assertNotVisible:
      id: dialog-cancel
- runFlow:
      when:
          notVisible:
              id: drawer-sort
      commands:
          - tapOn:
                id: app-bar-menu
          - waitForAnimationToEnd
- assertVisible:
      id: drawer-sort
