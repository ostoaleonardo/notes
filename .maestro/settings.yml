appId: com.monospace.notes
---
- launchApp
- extendedWaitUntil:
    visible:
      id: app-bar-menu
    timeout: 30000
- tapOn:
    id: app-bar-menu
- waitForAnimationToEnd
- tapOn:
    id: drawer-settings
- waitForAnimationToEnd
- assertVisible:
    id: app-bar-back
- assertVisible:
    id: setting-language
- tapOn:
    id: heading-font-geist
- waitForAnimationToEnd
- tapOn:
    id: heading-font-ntype82
- waitForAnimationToEnd
- tapOn:
    id: setting-language
- waitForAnimationToEnd
- assertVisible:
    id: menu-item-en
- back
- waitForAnimationToEnd
- assertNotVisible:
    id: menu-item-en
- scrollUntilVisible:
    element:
      id: setting-delete-behavior
- tapOn:
    id: setting-delete-behavior
- waitForAnimationToEnd
- tapOn:
    id: menu-item-vault-trash
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: setting-default-note-folder
- tapOn:
    id: setting-default-note-folder
- waitForAnimationToEnd
- runFlow:
    file: subflows/select-folder-in-menu.yml
    env:
      FOLDER: maestro-folder
- assertVisible:
    id: setting-default-note-folder-value
    text: '.*maestro-folder.*'
- tapOn:
    id: setting-default-note-folder
- waitForAnimationToEnd
- tapOn:
    id: menu-item-
- waitForAnimationToEnd
- assertNotVisible:
    id: setting-default-note-folder-value
    text: '.*maestro-folder.*'
- scrollUntilVisible:
    element:
      id: setting-editor-tab-size
- assertVisible:
    id: setting-editor-line-width
- tapOn:
    id: setting-editor-tab-size
- waitForAnimationToEnd
- tapOn:
    id: menu-item-8
- waitForAnimationToEnd
- assertVisible:
    id: setting-editor-tab-size-value
    text: '8'
- tapOn:
    id: setting-editor-tab-size
- waitForAnimationToEnd
- tapOn:
    id: menu-item-4
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: setting-daily-note-folder
- tapOn:
    id: setting-daily-note-folder
- waitForAnimationToEnd
- tapOn:
    id: menu-item-
- waitForAnimationToEnd
- tapOn:
    id: app-bar-back
- assertVisible:
    id: home-create-note
