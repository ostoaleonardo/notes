appId: com.monospace.notes
---
- runFlow:
    file: subflows/create-note.yml
    env:
      TITLE: maestro-pair
- inputText: '*'
- assertVisible:
    id: editor-meta
    text: '1\D+2\D+'
- pressKey: Backspace
- assertNotVisible:
    id: editor-meta
    text: '1\D+2\D+'
- runFlow: subflows/delete-note.yml
