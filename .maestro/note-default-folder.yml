appId: com.monospace.notes
---
- launchApp
- extendedWaitUntil:
    visible:
      id: app-bar-menu
    timeout: 30000
- tapOn:
    id: app-bar-menu
- waitForAnimationToEnd
- tapOn:
    id: drawer-settings
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: setting-default-note-folder
- tapOn:
    id: setting-default-note-folder
- waitForAnimationToEnd
- runFlow:
    file: subflows/select-folder-in-menu.yml
    env:
      FOLDER: maestro-folder
- tapOn:
    id: app-bar-back
- runFlow:
    file: subflows/create-note.yml
    env:
      TITLE: maestro-default
- inputText: default folder check
- hideKeyboard
- waitForAnimationToEnd
- runFlow: subflows/delete-note.yml
- tapOn:
    id: app-bar-menu
- waitForAnimationToEnd
- tapOn:
    id: drawer-settings
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: setting-default-note-folder
- tapOn:
    id: setting-default-note-folder
- waitForAnimationToEnd
- tapOn:
    id: menu-item-
- waitForAnimationToEnd
- assertNotVisible:
    id: setting-default-note-folder-value
    text: '.*maestro-folder.*'
