appId: com.monospace.notes
---
- runFlow:
    file: subflows/open-note.yml
    env:
      NOTE: Root note 1
- runFlow:
    file: subflows/open-editor-menu.yml
    env:
      ITEM: menu-item-move
- tapOn:
    id: menu-item-move
- waitForAnimationToEnd
- assertVisible:
    id: sheet
- scrollUntilVisible:
    element:
      id: move-target
      text: "(?i)maestro-folder"
- swipe:
    start: 50%,75%
    end: 50%,45%
- tapOn:
    id: move-target
    text: "(?i)maestro-folder"
- waitForAnimationToEnd
- assertNotVisible:
    id: sheet
- runFlow:
    file: subflows/open-editor-menu.yml
    env:
      ITEM: menu-item-move
- tapOn:
    id: menu-item-move
- waitForAnimationToEnd
- assertVisible:
    id: sheet
- tapOn:
    id: move-target
    index: 0
- waitForAnimationToEnd
- assertNotVisible:
    id: sheet
