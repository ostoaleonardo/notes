appId: com.monospace.notes
---
- launchApp
- extendedWaitUntil:
    visible:
      id: app-bar-menu
    timeout: 30000
- tapOn:
    id: app-bar-menu
- tapOn:
    id: drawer-repositories
- waitForAnimationToEnd
- assertVisible:
    id: app-bar-back
- assertVisible:
    id: repositories-add
- tapOn:
    id: repository-menu
- waitForAnimationToEnd
- assertVisible:
    id: menu-item-rename
- back
- waitForAnimationToEnd
- assertNotVisible:
    id: menu-item-rename
- assertVisible:
    id: repositories-add
- tapOn:
    id: app-bar-back
- assertVisible:
    id: home-create-note
