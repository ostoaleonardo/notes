appId: com.monospace.notes
---
- runFlow: subflows/create-fixture-note.yml
- assertVisible:
    id: toolbar-bold
- tapOn:
    id: toolbar-bold
- inputText: bold
- tapOn:
    id: editor-menu
- waitForAnimationToEnd
- tapOn:
    id: menu-item-code
- waitForAnimationToEnd
- assertVisible: '(?s).*\*\*bold\*\*.*'
- runFlow: subflows/delete-note.yml
