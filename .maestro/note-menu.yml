appId: com.monospace.notes
---
- runFlow: subflows/create-fixture-note.yml
- runFlow: subflows/open-note-details.yml
- tapOn:
    id: details-outline
- waitForAnimationToEnd
- assertVisible:
    id: sheet
- assertVisible: Alpha
- assertVisible: Beta
- back
- waitForAnimationToEnd
- assertNotVisible:
    id: sheet
- runFlow: subflows/open-note-details.yml
- tapOn:
    id: details-outgoing-links
- waitForAnimationToEnd
- assertVisible:
    id: sheet
- back
- waitForAnimationToEnd
- runFlow: subflows/open-note-details.yml
- tapOn:
    id: details-version-history
- waitForAnimationToEnd
- assertVisible:
    id: app-bar-back
- assertNotVisible:
    id: editor-menu
- tapOn:
    id: app-bar-back
- waitForAnimationToEnd
- assertVisible:
    id: editor-menu
- runFlow: subflows/delete-note.yml
