appId: com.monospace.notes
---
- launchApp
- extendedWaitUntil:
      visible:
          id: app-bar-menu
      timeout: 45000
- tapOn:
      id: app-bar-menu
- waitForAnimationToEnd
- tapOn:
      id: drawer-connections
- waitForAnimationToEnd
- assertVisible:
      id: connections-focus-center
- tapOn:
      id: connections-focus-center
- waitForAnimationToEnd
- assertVisible:
      id: sheet
- assertVisible:
      id: relations-tab-folders
- tapOn:
      id: relations-tab-tags
- waitForAnimationToEnd
- assertVisible:
      id: relations-tab-tags
- back
- waitForAnimationToEnd
- tapOn:
      id: connections-pending
- waitForAnimationToEnd
- assertVisible:
      id: pending-tab-orphans
- scrollUntilVisible:
      element: "(?i)orphan a"
- tapOn: "(?i)orphan a"
- waitForAnimationToEnd
- assertVisible:
      id: editor-mode-toggle
- back
- waitForAnimationToEnd
- assertVisible:
      id: app-bar-back
- tapOn:
      id: app-bar-back
- waitForAnimationToEnd
- tapOn:
      id: connections-search
- waitForAnimationToEnd
- assertVisible:
      id: origin-tile-note
- assertVisible:
      id: origin-tile-tag
- assertVisible:
      id: origin-tile-file
- assertVisible:
      id: origin-tile-folder
