appId: com.monospace.notes
---
- runFlow:
    file: subflows/create-note.yml
    env:
      TITLE: maestro-links
- inputText: '[[maestro-ghost'
- hideKeyboard
- waitForAnimationToEnd
- tapOn:
    id: app-bar-menu
- waitForAnimationToEnd
- runFlow:
    file: subflows/switch-view.yml
    env:
      VIEW: NOTAS HUÉRFANAS
- extendedWaitUntil:
    visible: (Untitled|maestro-links)
    timeout: 8000
- runFlow:
    file: subflows/switch-view.yml
    env:
      VIEW: ENLACES SIN RESOLVER
- extendedWaitUntil:
    visible: maestro-ghost
    timeout: 8000
- tapOn: maestro-ghost
- waitForAnimationToEnd
- assertVisible: Nota no encontrada
- tapOn: Cancelar
- waitForAnimationToEnd
- runFlow:
    file: subflows/switch-view.yml
    env:
      VIEW: NOTAS
- tapOn: (Untitled|maestro-links)
- waitForAnimationToEnd
- runFlow: subflows/delete-note.yml
- runFlow: subflows/open-drawer.yml
