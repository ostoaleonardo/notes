appId: com.monospace.notes
---
- launchApp
- extendedWaitUntil:
    visible:
      id: app-bar-menu
    timeout: 30000
- runFlow: subflows/open-drawer.yml
- assertVisible:
      id: drawer-daily-note
- runFlow:
      file: subflows/switch-view.yml
      env:
          VIEW: templates
- assertVisible:
      id: drawer-new-template
- assertNotVisible:
      id: drawer-daily-note
- runFlow:
      file: subflows/switch-view.yml
      env:
          VIEW: tags
- assertVisible:
      id: drawer-tag-sort-usage
- runFlow:
      file: subflows/switch-view.yml
      env:
          VIEW: files
- assertNotVisible:
      id: drawer-tag-sort-usage
- runFlow:
      file: subflows/switch-view.yml
      env:
          VIEW: notes
- assertVisible:
      id: drawer-daily-note
