appId: com.monospace.notes
---
- runFlow: subflows/create-fixture-note.yml
- tapOn:
    id: editor-mode-toggle
- waitForAnimationToEnd
- tapOn:
    id: toolbar-recent
- waitForAnimationToEnd
- assertVisible:
    id: sheet
- back
- waitForAnimationToEnd
- assertNotVisible:
    id: sheet
- tapOn:
    id: toolbar-templates
- waitForAnimationToEnd
- assertVisible:
    id: template-save
- back
- waitForAnimationToEnd
- assertNotVisible:
    id: sheet
- assertVisible:
    id: toolbar-undo
- runFlow: subflows/delete-note.yml
