[package]
name = "engine"
version.workspace = true
edition.workspace = true

[dependencies]
icu_collator = "2"
icu_locale = "2"
icu_normalizer = "2"
rayon = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde_yaml_ng = "0.10"
thiserror = "2"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
